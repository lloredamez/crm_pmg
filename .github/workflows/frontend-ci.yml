name: Frontend CI - Build & Publish Package

on:
  push:
    tags:
      - 'frontend@v*'
      - 'frotend@v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract tag version
        id: extract_version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # Extrai a versão removendo frontend@ ou frotend@
          VERSION="${TAG_NAME#frontend@}"
          VERSION="${VERSION#frotend@}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare Image Name
        id: image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/crm-frontend"
          echo "IMAGE_NAME=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.extract_version.outputs.VERSION }}
            ${{ steps.image.outputs.IMAGE_NAME }}:latest
